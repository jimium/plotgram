name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PLOTGRAM_FONTS_DIR: ${{ github.workspace }}/fonts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests (core + eval)
        run: |
          cargo test -p plotgram-core --lib
          cargo test -p plotgram-eval --lib deterministic

      - name: Phase6 penalty ratio + registry
        run: ./benchmarks/scripts/check-penalty-ratio.sh

      - name: Phase6 semantic isolation
        run: ./benchmarks/scripts/check-semantic-isolation.sh

      - name: G0 group write ratchet
        run: ./benchmarks/scripts/check-group-writes.sh

      - name: G5 builder entry ratchet
        run: ./benchmarks/scripts/check-builder-entry.sh
