[workspace]
resolver = "2"
members = [
    "crates/plotgram-core",
    "crates/plotgram-cli",
    "crates/plotgram-server",
    "crates/plotgram-wasm",
    "crates/plotgram-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/your-org/plotgram"
description = "A chart description language and rendering engine designed for AI Agents — Turn anything into a diagram"

[workspace.dependencies]
plotgram-core = { path = "crates/plotgram-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[profile.release.package.plotgram-wasm]
opt-level = "z"
