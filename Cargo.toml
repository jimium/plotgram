[workspace]
resolver = "2"
members = [
    "crates/plotgram-model",
    "crates/plotgram-content",
    "crates/plotgram-parse",
    "crates/plotgram-compile",
    "crates/plotgram-engine-api",
    "crates/plotgram-algo",
    "crates/plotgram-router",
    "crates/plotgram-layout",
    "crates/plotgram-engine",
    "crates/plotgram-render",
    "crates/plotgram-cli",
    "crates/plotgram-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/your-org/plotgram"
description = "A chart description language and rendering engine designed for AI Agents — Turn anything into a diagram"

[workspace.dependencies]
plotgram-model = { path = "crates/plotgram-model" }
plotgram-content = { path = "crates/plotgram-content" }
plotgram-parse = { path = "crates/plotgram-parse" }
plotgram-compile = { path = "crates/plotgram-compile" }
plotgram-engine-api = { path = "crates/plotgram-engine-api" }
plotgram-algo = { path = "crates/plotgram-algo" }
plotgram-router = { path = "crates/plotgram-router" }
plotgram-layout = { path = "crates/plotgram-layout" }
plotgram-engine = { path = "crates/plotgram-engine" }
plotgram-render = { path = "crates/plotgram-render" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 256
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = 0

