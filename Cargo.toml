[workspace]
resolver = "2"
members = [
    "crates/tautcore-model",
    "crates/tautcore-content",
    "crates/tautcore-parse",
    "crates/tautcore-compile",
    "crates/tautcore-engine-api",
    "crates/tautcore-algo",
    "crates/tautcore-router",
    "crates/tautcore-layout",
    "crates/tautcore-engine",
    "crates/tautcore-render",
    "crates/tautcore-cli",
    "crates/tautcore-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/your-org/tautcore"
description = "A chart description language and rendering engine designed for AI Agents — Turn anything into a diagram"

[workspace.dependencies]
tautcore-model = { path = "crates/tautcore-model" }
tautcore-content = { path = "crates/tautcore-content" }
tautcore-parse = { path = "crates/tautcore-parse" }
tautcore-compile = { path = "crates/tautcore-compile" }
tautcore-engine-api = { path = "crates/tautcore-engine-api" }
tautcore-algo = { path = "crates/tautcore-algo" }
tautcore-router = { path = "crates/tautcore-router" }
tautcore-layout = { path = "crates/tautcore-layout" }
tautcore-engine = { path = "crates/tautcore-engine" }
tautcore-render = { path = "crates/tautcore-render" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 256
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = 0

