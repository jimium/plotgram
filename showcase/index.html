<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plotgram Showcase · 可视化语法画廊</title>
  <link rel="icon" href="assets/brand/logo-icon-16.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --panel-soft: rgba(255, 255, 255, 0.82);
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.14);
      --text: #0f172a;
      --muted: #475569;
      --muted-soft: #64748b;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 10px 24px rgba(15, 23, 42, 0.06);
      --blue: #2563eb;
      --blue-strong: #1d4ed8;
      --blue-soft: rgba(37, 99, 235, 0.1);
      --chip: #e8edf5;
      --chip-active: #dbeafe;
      --chip-text: #1e293b;
      --radius: 16px;
      --radius-sm: 11px;
      --preview-bg: #f8fafc;

      /* 代码高亮（GitHub light 风格） */
      --code-bg: #f6f8fa;
      --code-text: #1f2328;
      --tok-comment: #6e7781;
      --tok-string: #0a3069;
      --tok-keyword: #cf222e;
      --tok-type: #953800;
      --tok-number: #0550ae;
      --tok-arrow: #cf222e;
      --tok-property: #8250df;
      --tok-bracket: #6e7781;
      --tok-bool: #0550ae;
      --tok-ident: #1f2328;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.07), transparent 30%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 16px 22px 48px;
    }

    /* ─── 工作区 ───────────────────────────── */
    .workspace {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding-right: 2px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px;
    }

    .sidebar-header .brand-logo {
      height: 26px;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      flex: 0 0 auto;
    }

    .sidebar-header .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      min-width: 0;
    }

    .sidebar-header .brand-text strong {
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .sidebar-header .brand-text span {
      color: var(--muted-soft);
      font-size: 11px;
      margin-top: 1px;
    }

    .sidebar-card {
      padding: 16px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
    }

    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: #fff;
      padding: 0 12px 0 36px;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box input:focus {
      border-color: rgba(37, 99, 235, 0.45);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted-soft);
      pointer-events: none;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-section:last-child {
      margin-bottom: 0;
    }

    .filter-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted-soft);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .filter-label .filter-count {
      color: var(--blue);
      font-size: 11px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--chip);
      color: var(--chip-text);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .chip:hover {
      transform: translateY(-1px);
    }

    .chip.active {
      background: var(--chip-active);
      color: var(--blue);
      border-color: rgba(59, 130, 246, 0.22);
    }

    .chip small {
      color: var(--muted-soft);
      font-size: 11px;
      font-weight: 700;
    }

    .chip.active small {
      color: var(--blue);
    }

    .segmented {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border-radius: 11px;
      background: var(--chip);
      border: 1px solid var(--border);
    }

    .segmented button {
      flex: 1;
      border: 0;
      padding: 6px 8px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .segmented button.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
    }

    details.filter-section > summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
    }

    details.filter-section > summary::-webkit-details-marker {
      display: none;
    }

    details.filter-section > summary .caret {
      color: var(--muted-soft);
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    details.filter-section[open] > summary .caret {
      transform: rotate(180deg);
    }

    .sidebar-foot {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .sidebar-btn {
      flex: 1;
      height: 38px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }

    .sidebar-btn:hover {
      border-color: rgba(59, 130, 246, 0.3);
      color: var(--blue);
      transform: translateY(-1px);
    }

    .sidebar-btn.primary {
      background: linear-gradient(135deg, var(--blue-strong), var(--blue));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
    }

    /* ─── 内容区 ───────────────────────────── */
    .content {
      min-width: 0;
      position: relative;
    }

    .gallery-view,
    .detail-view {
      display: none;
    }

    .content[data-mode="gallery"] .gallery-view {
      display: block;
    }

    .content[data-mode="detail"] .detail-view {
      display: flex;
      flex-direction: column;
    }

    /* 画廊视图 */
    .gallery-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin: 2px 2px 14px;
      flex-wrap: wrap;
    }

    .gallery-head h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .gallery-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 60%;
      justify-content: flex-end;
    }

    .active-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-strong);
      font-size: 12px;
      font-weight: 700;
    }

    .active-filter.muted {
      background: #f1f5f9;
      color: var(--muted-soft);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.24);
    }

    .card-preview {
      position: relative;
      aspect-ratio: 16 / 10;
      padding: 12px;
      background: var(--preview-bg);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover .card-preview img {
      transform: scale(1.03);
    }

    .card-featured-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.92);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 13px 14px 14px;
      flex: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .card-title {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .card:hover .card-title {
      color: var(--blue);
    }

    .card-path {
      margin: 3px 0 0;
      color: var(--muted-soft);
      font-size: 11px;
      line-height: 1.4;
      word-break: break-all;
    }

    .role-badge {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .role-badge.smoke {
      color: #166534;
      background: rgba(34, 197, 94, 0.14);
    }

    .role-badge.product {
      color: var(--blue-strong);
      background: rgba(59, 130, 246, 0.14);
    }

    .role-badge.demo {
      color: #6b21a8;
      background: rgba(168, 85, 247, 0.16);
    }

    .role-badge.stress {
      color: #9a3412;
      background: rgba(249, 115, 22, 0.16);
    }

    .role-badge.mech {
      color: #155e75;
      background: rgba(6, 182, 212, 0.16);
    }

    .role-badge.dim {
      opacity: 0.55;
      filter: saturate(0.7);
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag-pill {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #1e3a8a;
      background: var(--blue-soft);
    }

    .card-cta {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .empty {
      display: none;
      margin-top: 14px;
      padding: 44px 22px;
      text-align: center;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.7);
      border: 1px dashed var(--border-strong);
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 17px;
      margin-bottom: 6px;
    }

    /* ─── 详情视图（左右分栏） ─────────────── */
    .detail-view {
      gap: 14px;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      flex-wrap: wrap;
    }

    .back-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 14px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }

    .back-btn:hover {
      border-color: rgba(59, 130, 246, 0.3);
      color: var(--blue);
      transform: translateX(-2px);
    }

    .detail-title {
      flex: 1 1 auto;
      min-width: 0;
    }

    .detail-title h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .detail-title p {
      margin: 3px 0 0;
      color: var(--muted-soft);
      font-size: 12px;
      word-break: break-all;
    }

    .detail-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }

    .detail-nav button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease;
    }

    .detail-nav button:hover:not(:disabled) {
      border-color: rgba(59, 130, 246, 0.3);
      color: var(--blue);
    }

    .detail-nav button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .detail-nav .counter {
      padding: 0 8px;
      color: var(--muted-soft);
      font-size: 12px;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
    }

    .detail-links {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .detail-links a {
      height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      transition: transform 0.12s ease;
    }

    .detail-links a:hover {
      transform: translateY(-1px);
    }

    .detail-links a.primary {
      background: linear-gradient(135deg, var(--blue-strong), var(--blue));
      color: #fff;
    }

    .detail-links a.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border-strong);
    }

    .detail-highlight {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.08), rgba(139, 92, 246, 0.05));
      border: 1px solid rgba(59, 130, 246, 0.16);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .detail-highlight .hl-icon {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
    }

    .detail-highlight strong {
      color: var(--text);
      font-weight: 700;
    }

    .detail-body {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 14px;
      min-height: 540px;
      height: calc(100vh - 230px);
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .pane-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(248, 250, 252, 0.8);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex: 0 0 auto;
    }

    .pane-label .pane-tag {
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted-soft);
      font-weight: 600;
      font-size: 11.5px;
    }

    .copy-btn {
      height: 28px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
    }

    .copy-btn:hover {
      border-color: rgba(59, 130, 246, 0.3);
      color: var(--blue);
    }

    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.3);
      color: #166534;
    }

    .pane-content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .pane-viz .pane-content {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #f8fafc;
    }

    .pane-viz img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
      transition: opacity 0.15s ease;
    }

    .pane-viz img:hover {
      opacity: 0.88;
    }

    /* 图片放大灯箱 —— 支持滚轮缩放 + 拖拽平移 */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox.dragging {
      cursor: grabbing;
    }

    .lightbox img {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.4);
      max-width: none;
      transform-origin: 0 0;
      will-change: transform;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 2;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.32);
      transform: scale(1.1);
    }

    .lightbox-toolbar {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 2;
      display: flex;
      gap: 8px;
      user-select: none;
    }

    .lightbox-toolbar button {
      padding: 6px 14px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background 0.2s ease;
    }

    .lightbox-toolbar button:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .lightbox-toolbar .zoom-pct {
      padding: 6px 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      min-width: 48px;
      justify-content: center;
      cursor: pointer;
      font-family: inherit;
    }

    .lightbox-toolbar .zoom-pct:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* 详情视图：全宽开关 */
    .detail-body.full-viz {
      grid-template-columns: 1fr;
    }

      padding: 0 12px;

      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
      margin-left: 8px;
    }

    .full-viz-btn:hover {
      border-color: rgba(59, 130, 246, 0.3);
      color: var(--blue);
    }

      background: rgba(37, 99, 235, 0.1);
      border-color: rgba(59, 130, 246, 0.3);
      color: var(--blue);
    }

    .viz-placeholder {
      text-align: center;
      color: var(--muted-soft);
      font-size: 14px;
    }

    /* 代码区 */
    .code-pane {
      background: var(--code-bg);
      overflow: auto;
    }

    .code-pane .pane-content {
      overflow: auto;
    }

    .code-listing {
      margin: 0;
      padding: 12px 0;
      font-family: "JetBrains Mono", "SF Mono", Monaco, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--code-text);
      counter-reset: ln;
    }

    .code-line {
      display: flex;
      align-items: flex-start;
      padding: 0 14px 0 0;
    }

    .code-line::before {
      counter-increment: ln;
      content: counter(ln);
      flex: 0 0 44px;
      padding-right: 12px;
      text-align: right;
      color: #8c959f;
      user-select: none;
      font-size: 11.5px;
    }

    .code-line .lc {
      white-space: pre;
      tab-size: 4;
      min-width: 0;
    }

    .tok-comment { color: var(--tok-comment); font-style: italic; }
    .tok-string { color: var(--tok-string); }
    .tok-keyword { color: var(--tok-keyword); font-weight: 600; }
    .tok-type { color: var(--tok-type); font-weight: 600; }
    .tok-number { color: var(--tok-number); }
    .tok-arrow { color: var(--tok-arrow); font-weight: 600; }
    .tok-property { color: var(--tok-property); }
    .tok-bracket { color: var(--tok-bracket); }
    .tok-bool { color: var(--tok-bool); }
    .tok-ident { color: var(--tok-ident); }

    .code-loading {
      padding: 24px;
      color: var(--muted-soft);
      font-size: 13px;
    }

    .code-error {
      padding: 24px;
      color: #b91c1c;
      font-size: 13px;
    }

    .footer-note {
      margin-top: 22px;
      color: var(--muted-soft);
      font-size: 12px;
      text-align: center;
    }

      .workspace {

      }

      .detail-body {

      }
    }

        max-height: 420px;
      }

        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));

      const cacheBust = BUILD_HASH && !BUILD_HASH.includes("{{") ? BUILD_HASH : "";
      const suffix = cacheBust && isSvg ? `?v=${cacheBust}` : "";
      // 只有 SVG 走 CDN,其他资源(.pgm / .json 等)走 demo 站相对路径

    function humanizeSlug(slug) {
      return slug
        .replace(/-/g, " ")
        .replace(/\b\w/g, (ch) => ch.toUpperCase());
    }

    function deriveTags(path) {
      const tags = new Set();
      const lower = path.toLowerCase();

      if (lower.includes("k8s")) tags.add("K8s");
      if (lower.includes("cluster")) tags.add("平台工程");
      if (lower.includes("rollout") || lower.includes("rollback") || lower.includes("release") || lower.includes("canary") || lower.includes("blue-green")) tags.add("发布治理");
      if (lower.includes("incident") || lower.includes("failure") || lower.includes("degradation") || lower.includes("pressure")) tags.add("稳定性");
      if (lower.includes("tenant") || lower.includes("hybrid-cloud") || lower.includes("approval")) tags.add("合规");
      if (lower.includes("ai-agent") || lower.includes("pr-architecture") || lower.includes("document-sync") || lower.includes("docops")) tags.add("AI Agent");
      if (lower.includes("data-lineage") || lower.includes("data-pipeline")) tags.add("数据治理");
      if (lower.includes("payment") || lower.includes("settlement") || lower.includes("aml") || lower.includes("risk")) tags.add("金融");
      if (lower.includes("supply-chain")) tags.add("供应链");
      if (lower.includes("mindmap")) tags.add("知识组织");
      if (lower.includes("layout-stress")) tags.add("布局压力");
      if (lower.includes("ecommerce")) tags.add("电商");
      if (lower.includes("microservice")) tags.add("微服务");
      if (lower.includes("compiler")) tags.add("工程系统");
      if (lower.includes("oauth") || lower.includes("auth")) tags.add("认证");
      if (lower.includes("social-network") || lower.includes("blog") || lower.includes("school")) tags.add("业务建模");

        .join(" ")
        .toLowerCase();
      const keyword = state.search.trim().toLowerCase();

      if (keyword && !haystack.includes(keyword)) return false;
      if (state.type !== "all" && sample.type !== state.type) return false;
      if (!state.roles.has(sample.role)) return false;
      if (state.tag !== "all" && !sample.tags.includes(state.tag)) return false;
      return true;
    }

        const ra = ROLE_ORDER.indexOf(a.role);
        const rb = ROLE_ORDER.indexOf(b.role);
        if (ra !== rb) return ra - rb;
        if (a.type !== b.type) return a.type.localeCompare(b.type);
        return a.title.localeCompare(b.title, "zh-CN");
      });
    }

    // ─── DSL 语法高亮（轻量自实现） ───────────
    const PG_KEYWORDS = new Set(["diagram", "entity", "group", "relation", "node_style", "edge_style", "meta"]);
    const PG_TYPES = new Set(["flowchart", "sequence", "architecture", "state", "er", "mindmap"]);
    const PG_BOOLS = new Set(["true", "false"]);

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function highlightPgm(code) {
      // 逐行处理：注释整行、字符串单行；其余按 token 切分
      const lines = code.split("\n");
      const outLines = [];

      for (const line of lines) {
        let i = 0;
        let html = "";
        const n = line.length;

        while (i < n) {
          const rest = line.slice(i);

          // 空白
          const ws = /^[ \t]+/.exec(rest);
          if (ws) { html += ws[0]; i += ws[0].length; continue; }

          // 注释
          if (rest.startsWith("//")) {
            html += `<span class="tok-comment">${escapeHtml(rest)}</span>`;
            i = n;
            continue;
          }

          // 字符串
          if (rest[0] === '"') {
            const m = /^"(?:[^"\\]|\\.)*"?/.exec(rest);
            const txt = m ? m[0] : '"';
            html += `<span class="tok-string">${escapeHtml(txt)}</span>`;
            i += txt.length;
            continue;
          }

          // 箭头（先匹配多字符）
          const arr = /^(?:<->|-->|->)/.exec(rest);
          if (arr) {
            html += `<span class="tok-arrow">${escapeHtml(arr[0])}</span>`;
            i += arr[0].length;
            continue;
          }

          // 数字
          const num = /^-?\d+(?:\.\d+)?/.exec(rest);
          if (num) {
            html += `<span class="tok-number">${escapeHtml(num[0])}</span>`;
            i += num[0].length;
            continue;
          }

          // 括号
          if (/^[{}[\]()]/.test(rest[0])) {
            html += `<span class="tok-bracket">${escapeHtml(rest[0])}</span>`;
            i += 1;
            continue;
          }

          // 标点
          if (/^[:,]/.test(rest[0])) {
            html += `<span class="tok-bracket">${escapeHtml(rest[0])}</span>`;
            i += 1;
            continue;
          }

          // 标识符
          const id = /^[A-Za-z_]\w*/.exec(rest);
          if (id) {
            const word = id[0];
            const after = rest.slice(word.length);
            const isProp = /^\s*:/.test(after);
            let cls;
            if (isProp) cls = "tok-property";
            else if (PG_KEYWORDS.has(word)) cls = "tok-keyword";
            else if (PG_TYPES.has(word)) cls = "tok-type";
            else if (PG_BOOLS.has(word)) cls = "tok-bool";
            else cls = "tok-ident";
            html += `<span class="${cls}">${escapeHtml(word)}</span>`;
            i += word.length;
            continue;
          }

          // 其他字符直接输出
          html += escapeHtml(rest[0]);
          i += 1;
        }

        outLines.push(html || " ");
      }

      // 生成带行号的 HTML
      return outLines
        .map((lc) => `<div class="code-line"><span class="lc">${lc}</span></div>`)
        .join("");
    }

    async function loadDsl(sample) {
      const path = assetUrl(sample.path);
      if (dslCodeCache[path]) return dslCodeCache[path];
      const response = await fetch(path, { cache: "no-cache" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      dslCodeCache[path] = text;
      return text;
    }

      detailPath.textContent = `${sample.path} · ${sample.typeCn} · ${sample.roleCn}`;
      detailVizTag.textContent = `${sample.typeLabel} / ${sample.roleLabel}`;

      detailHighlightText.innerHTML = `<strong>${sample.typeCn}能力</strong> · ${sample.highlight}${sample.featured ? ' · <strong style="color:var(--blue)">精选案例</strong>' : ""}`;

      // 可视化
      detailViz.innerHTML = `<img src="${assetUrl(sample.svgPath)}" alt="${sample.title}" />`;
      const img = detailViz.querySelector("img");
      img.addEventListener("error", () => {
        detailViz.innerHTML = `<div class="viz-placeholder">SVG 加载失败：${escapeHtml(sample.svgPath)}</div>`;
      });
      img.addEventListener("click", () => {
        openLightbox(assetUrl(sample.svgPath), sample.title);
      });

      // DSL
      detailCode.innerHTML = '<div class="code-loading">加载 DSL 源码...</div>';
      loadDsl(sample)
        .then((code) => {
          detailCode.innerHTML = `<pre class="code-listing">${highlightPgm(code)}</pre>`;
        })
        .catch((err) => {
          detailCode.innerHTML = `<div class="code-error">DSL 源码加载失败：${escapeHtml(String(err))}<br><br>路径：${escapeHtml(sample.path)}</div>`;
        });

      // 链接
      detailOpenEditor.href = `/editor/?pgm=${encodeURIComponent(sample.path)}`;
      detailOpenSvg.href = assetUrl(sample.svgPath);
      detailOpenDsl.href = assetUrl(sample.path);

      // 导航按钮
      detailPrev.disabled = state.detailIndex <= 0;
      detailNext.disabled = state.detailIndex >= currentVisibleSamples.length - 1;
      detailCounter.textContent = `${state.detailIndex + 1} / ${currentVisibleSamples.length}`;

      copyCodeBtn.classList.remove("copied");
      copyCodeBtn.textContent = "复制代码";
    }

    function navigateDetail(direction) {
      const next = state.detailIndex + direction;
      if (next < 0 || next >= currentVisibleSamples.length) return;
      state.detailIndex = next;
      renderDetail();
    }

    // ─── 复制代码 ─────────────────────────────
    copyCodeBtn.addEventListener("click", async () => {
      const sample = currentVisibleSamples[state.detailIndex];
      if (!sample) return;
      try {
        const code = dslCodeCache[assetUrl(sample.path)] || "";
        if (!code) return;
        await navigator.clipboard.writeText(code);
        copyCodeBtn.classList.add("copied");
        copyCodeBtn.textContent = "已复制 ✓";
        setTimeout(() => {
          copyCodeBtn.classList.remove("copied");
          copyCodeBtn.textContent = "复制代码";
        }, 1800);
      } catch {
        copyCodeBtn.textContent = "复制失败";
        setTimeout(() => { copyCodeBtn.textContent = "复制代码"; }, 1800);
      }
    });

    // ─── 事件绑定 ─────────────────────────────
    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      if (state.mode === "detail") showGallery();
      renderCards();
    });

    document.getElementById("resetFilters").addEventListener("click", () => {
      state.search = "";
      state.type = "all";
      state.roles = new Set(DEFAULT_ROLES);
      state.tag = "all";
      searchInput.value = "";
      if (state.mode === "detail") showGallery();
      renderAll();
    });

    document.getElementById("scrollFeatured").addEventListener("click", () => {
      if (state.mode !== "gallery") {
        showGallery();
        renderAll();
      }
      // 滚动到第一个精选卡片
      setTimeout(() => {
        const firstFeatured = document.querySelector('[data-featured="true"]');
        if (firstFeatured) {
          firstFeatured.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }, 50);
    });

    backBtn.addEventListener("click", showGallery);
    detailPrev.addEventListener("click", () => navigateDetail(-1));
    detailNext.addEventListener("click", () => navigateDetail(1));

    document.addEventListener("keydown", (e) => {
      if (lightbox.classList.contains("open")) {
        if (e.key === "Escape") closeLightbox();
        return;
      }
      if (state.mode !== "detail") return;
      if (e.key === "Escape") showGallery();
      if (e.key === "ArrowLeft") navigateDetail(-1);
      if (e.key === "ArrowRight") navigateDetail(1);
    });

    function renderAll() {
      renderFilters();
      renderCards();
    }

    // ─── 图片灯箱（滚轮缩放 + 拖拽平移）─────────
    let lbScale = 1;
    let lbPanX = 0, lbPanY = 0;
    let lbStartX = 0, lbStartY = 0, lbPanStartX = 0, lbPanStartY = 0;
    let lbDragging = false;
    let lbImgNaturalW = 0, lbImgNaturalH = 0;

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      lightboxImg.onload = () => { requestAnimationFrame(() => lbFitToScreen()); };
      if (lightboxImg.complete) requestAnimationFrame(() => lbFitToScreen());
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      setTimeout(() => { lightboxImg.removeAttribute("src"); }, 300);
    }

    function lbFitToScreen() {
      lbImgNaturalW = lightboxImg.naturalWidth || lightboxImg.offsetWidth;
      lbImgNaturalH = lightboxImg.naturalHeight || lightboxImg.offsetHeight;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const pad = 64;
      const fitScale = Math.min((vw - pad) / lbImgNaturalW, (vh - pad) / lbImgNaturalH, 1);
      lbScale = fitScale;
      lbPanX = (vw - lbImgNaturalW * lbScale) / 2;
      lbPanY = (vh - lbImgNaturalH * lbScale) / 2;
      lbApplyTransform();
    }

    function lbApplyTransform() {
      lightboxImg.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
      lbZoomPct.textContent = Math.round(lbScale * 100) + "%";
    }

    function lbZoom(centerX, centerY, factor) {
      const newScale = Math.min(Math.max(lbScale * factor, 0.15), 8);
      const ratio = newScale / lbScale;
      lbPanX = centerX - (centerX - lbPanX) * ratio;
      lbPanY = centerY - (centerY - lbPanY) * ratio;
      lbScale = newScale;
      lbApplyTransform();
    }

    lightbox.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        // pinch zoom：以光标为中心缩放
        const factor = Math.exp(-e.deltaY * 0.01);
        lbZoom(e.clientX, e.clientY, factor);
      } else {
        // 普通滚动：平移画面
        lbPanX -= e.deltaX;
        lbPanY -= e.deltaY;
        lbApplyTransform();
      }
    }, { passive: false });

    lightbox.addEventListener("pointerdown", (e) => {
      if (e.target.tagName === "BUTTON") return;
      lbDragging = true;
      lbStartX = e.clientX;
      lbStartY = e.clientY;
      lbPanStartX = lbPanX;
      lbPanStartY = lbPanY;
      lightbox.classList.add("dragging");
    });

    document.addEventListener("pointermove", (e) => {
      if (!lbDragging) return;
      lbPanX = lbPanStartX + (e.clientX - lbStartX);
      lbPanY = lbPanStartY + (e.clientY - lbStartY);
      lbApplyTransform();
    });

    document.addEventListener("pointerup", () => {
      if (!lbDragging) return;
      lbDragging = false;
      lightbox.classList.remove("dragging");
    });

    lightbox.addEventListener("dblclick", (e) => {
      if (e.target.tagName === "BUTTON") return;
      if (lbScale < 0.99) {
        lbFitToScreen();
      } else {
        lbZoom(e.clientX, e.clientY, 2 / lbScale);
      }
    });

    lightboxClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    lbZoomOut.addEventListener("click", (e) => {
      e.stopPropagation();
      lbZoom(window.innerWidth / 2, window.innerHeight / 2, 1 / 1.3);
    });
    lbZoomIn.addEventListener("click", (e) => {
      e.stopPropagation();
      lbZoom(window.innerWidth / 2, window.innerHeight / 2, 1.3);
    });
    lbZoomFit.addEventListener("click", (e) => {
      e.stopPropagation();
      lbFitToScreen();
    });
    lbZoom1.addEventListener("click", (e) => {
      e.stopPropagation();
      lbScale = 1;
      lbPanX = (window.innerWidth - lbImgNaturalW) / 2;
      lbPanY = (window.innerHeight - lbImgNaturalH) / 2;
      lbApplyTransform();
    });

    // 点击百分比文字重置为 100% 并居中
    lbZoomPct.addEventListener("click", (e) => {
      e.stopPropagation();
      lbScale = 1;
      lbPanX = (window.innerWidth - lbImgNaturalW) / 2;
      lbPanY = (window.innerHeight - lbImgNaturalH) / 2;
      lbApplyTransform();
    });

    // ─── 全宽模式 ─────────────────────────────
    let fullViz = false;
    fullVizBtn.addEventListener("click", () => {
      fullViz = !fullViz;
      detailBody.classList.toggle("full-viz", fullViz);
      fullVizBtn.classList.toggle("active", fullViz);
      fullVizBtn.textContent = fullViz ? "分栏" : "全宽";
    });

    // ─── 启动 ─────────────────────────────────
    renderTopbarStats();
    renderAll();
  </script>
</body>
</html>
