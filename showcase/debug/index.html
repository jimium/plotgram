<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Plotgram Layout Debug Inspector</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
         display: grid; grid-template-columns: 340px 1fr 320px; height: 100vh; }
  aside, main { border-right: 1px solid #8884; overflow: auto; }
  aside:last-child { border-right: none; }
  h1 { font-size: 13px; margin: 0; padding: 8px 10px; border-bottom: 1px solid #8884; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
       margin: 10px 10px 4px; opacity: .65; }
  .pad { padding: 0 10px 10px; }
  textarea#source { width: 100%; height: 42vh; resize: vertical; tab-size: 4;
                    font: inherit; padding: 6px; }
  select, button { font: inherit; }
  #error { display: none; margin: 8px 10px; padding: 6px 8px; border: 1px solid #c33;
           background: #c332; white-space: pre-wrap; font-size: 12px; }
  #dropzone { margin: 8px 10px; padding: 10px; border: 1px dashed #8888;
              text-align: center; opacity: .7; font-size: 12px; }
  #dropzone.hover { border-color: #4af; opacity: 1; }
  #mode-note { display: none; margin: 0 10px; padding: 4px 8px; background: #4af2;
               font-size: 12px; }
  main { display: flex; flex-direction: column; }
  #layerbar { display: flex; gap: 12px; flex-wrap: wrap; padding: 6px 10px;
              border-bottom: 1px solid #8884; font-size: 12px; align-items: center; }
  #layerbar label { cursor: pointer; user-select: none; }
  #canvas-wrap { flex: 1; position: relative; }
  svg#canvas { position: absolute; inset: 0; width: 100%; height: 100%;
               cursor: grab; background:
               repeating-linear-gradient(0deg, #8881 0 1px, transparent 1px 24px),
               repeating-linear-gradient(90deg, #8881 0 1px, transparent 1px 24px); }
  svg#canvas.dragging { cursor: grabbing; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 0 10px 8px;
        font-size: 12px; }
  .kv dt { opacity: .6; }
  .kv dd { margin: 0; word-break: break-all; }
  details { margin: 0 10px 8px; font-size: 12px; }
  details pre { max-height: 30vh; overflow: auto; background: #8881; padding: 6px; }
  .sel-hit { cursor: pointer; }
  .selected { outline: none; }
  #status { padding: 4px 10px; font-size: 11px; opacity: .6;
            border-top: 1px solid #8884; }
</style>
</head>
<body>

<aside id="left">
  <h1>Layout Debug Inspector</h1>
  <div id="mode-note">只读模式：正在检视拖入的 trace.json（编辑源码可退出）</div>
  <h2>DSL 源（wasm 实时重跑）</h2>
  <div class="pad">
    <select id="fixture"></select>
    <textarea id="source" spellcheck="false"></textarea>
  </div>
  <div id="error"></div>
  <h2>或拖入 trace.json（纯查看）</h2>
  <div id="dropzone">drop *.trace.json here</div>
</aside>

<main>
  <div id="layerbar"><span>叠层：</span></div>
  <div id="canvas-wrap">
    <svg id="canvas"><g id="world"></g></svg>
  </div>
  <div id="status"></div>
</main>

<aside id="right">
  <h1>检视</h1>
  <h2>信封</h2>
  <dl class="kv" id="envelope"></dl>
  <h2>选中对象</h2>
  <div id="selection" class="pad" style="opacity:.6">点选画布元素</div>
</aside>

<script type="module" src="./js/app.js"></script>
</body>
</html>
