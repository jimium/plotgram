[package]
name = "plotgram-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bridge for the layout debug inspector (debug-inspector.md T2)"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# The cached wasm-opt binary predates current rustc output and fails
# validation; [profile.release] already uses opt-level="s" + lto.
wasm-opt = false

[dependencies]
plotgram-compile = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
