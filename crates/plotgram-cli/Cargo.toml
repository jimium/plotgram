[package]
name = "plotgram-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plotgram command-line interface"

[[bin]]
name = "plotgram"
path = "src/main.rs"

[dependencies]
plotgram-model = { path = "../plotgram-model" }
plotgram-engine = { path = "../plotgram-engine" }
plotgram-render = { path = "../plotgram-render" }
clap = { version = "4", features = ["derive"] }
