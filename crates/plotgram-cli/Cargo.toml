[package]
name = "plotgram-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plotgram command-line interface (thin I/O over plotgram-pipeline)"

[[bin]]
name = "plotgram"
path = "src/main.rs"

[dependencies]
plotgram-pipeline = { workspace = true }
clap = { version = "4", features = ["derive"] }
