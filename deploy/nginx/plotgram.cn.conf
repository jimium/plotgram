# plotgram.cn / www.plotgram.cn — 国内主站（shanxun 服务器）
#
# 镜像 demo.plotgram.dev 的目录结构与路由，部署在 shanxun 本机：
#   /var/www/plotgram.cn/         （根目录）
#     ├── playground/ agent/ showcase/ index.html ...
#
# 与 demo.plotgram.dev 的差异：
#   - 部署在 shanxun（与 CDN / Agent API 同机），不再走 plotgram.dev 海外站
#   - 静态资源（JS/CSS/WASM/SVG）仍走 assets.pg.agcli.cn CDN（CORS 允许 *）
#   - Agent API 仍走 api.pg.agcli.cn（CORS 已加 plotgram.cn 白名单）
#
# 相关别名：
#   api.plotgram.cn     → 见 api.pg.agcli.cn.conf（同 server 块 server_name 别名）
#   assets.plotgram.cn  → 见 assets.pg.agcli.cn.conf（同 server 块 server_name 别名）
#
# 证书：独立 certbot 证书 /etc/letsencrypt/live/plotgram.cn/
#   certbot certonly --webroot -w /var/www/letsencrypt \
#       -d plotgram.cn -d www.plotgram.cn

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name plotgram.cn www.plotgram.cn;

    ssl_certificate /etc/letsencrypt/live/plotgram.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plotgram.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS：强制浏览器后续访问走 HTTPS，消除"不安全"提示
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/plotgram.cn;
    index index.html;

    # 根路径及 docs 子路由：SPA 回退到 landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /playground/ {
        try_files $uri $uri/ /playground/index.html;
    }

    # Agent Demo：对话即画图
    location /agent/ {
        try_files $uri $uri/ /agent/index.html;
    }

    location /showcase/ {
        try_files $uri $uri/ /showcase/index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|css|png|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
}

server {
    listen 80;
    listen [::]:80;
    server_name plotgram.cn www.plotgram.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
