# assets.plotgram.cn — 静态资源 CDN（WASM、showcase SVG 等）

server {
    listen 80;
    listen [::]:80;
    server_name assets.plotgram.cn;

    root /var/www/assets.plotgram.cn;
    index index.html;

    # demo 站跨域加载 WASM / SVG / ES module
    add_header Access-Control-Allow-Origin "https://demo.plotgram.dev" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "https://demo.plotgram.dev" always;
    }

    location ~* \.(js|css|svg|png|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "https://demo.plotgram.dev" always;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/wasm
        image/svg+xml;
}
