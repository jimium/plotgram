# assets.pg.agcli.cn — 静态资源 CDN（WASM、showcase SVG、playground assets 等）
#
# 替代 assets.plotgram.cn（未备案），使用已备案的 agcli.cn 子域名

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name assets.pg.agcli.cn;

    ssl_certificate /etc/letsencrypt/live/assets.pg.agcli.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.pg.agcli.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/assets.pg.agcli.cn;
    index index.html;

    # 跨域加载 WASM / SVG / ES module
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        try_files $uri =404;
    }

    # plotgram wasm：文件名无 hash，依赖应用层 ?v=<md5> 破坏缓存
    location ^~ /playground/plotgram-wasm/ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # agent-demo wasm：同上策略
    location ^~ /agent/plotgram-wasm/ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Vite 打包产物带 content hash，可长期缓存
    location ^~ /playground/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /agent/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.(js|css|png|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/wasm
        image/svg+xml;
}

server {
    listen 80;
    listen [::]:80;
    server_name assets.pg.agcli.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
