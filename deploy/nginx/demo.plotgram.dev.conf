# demo.plotgram.dev — playground & showcase 静态站点

server {
    listen 80;
    listen [::]:80;
    server_name demo.plotgram.dev;

    root /var/www/plotgram;
    index index.html;

    # 根路径跳转到 showcase 画廊
    location = / {
        return 302 /showcase/;
    }

    location /playground/ {
        try_files $uri $uri/ /playground/index.html;
    }

    location /showcase/ {
        try_files $uri $uri/ /showcase/index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|css|png|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
}
