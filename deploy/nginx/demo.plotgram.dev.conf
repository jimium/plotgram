# demo.plotgram.dev — website(landing+docs) + playground & showcase 静态站点

server {
    server_name demo.plotgram.dev;

    root /var/www/plotgram;
    index index.html;

    # 根路径及 docs 子路由：SPA 回退到 landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /playground/ {
        try_files $uri $uri/ /playground/index.html;
    }

    location /showcase/ {
        try_files $uri $uri/ /showcase/index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|css|png|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/demo.plotgram.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.plotgram.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = demo.plotgram.dev) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name demo.plotgram.dev;
    return 404;
}
