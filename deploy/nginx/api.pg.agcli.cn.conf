# api.pg.agcli.cn — Plotgram Agent API（DeepSeek 中转 + 防滥用）
#
# 反向代理到本地 127.0.0.1:6080（plotgram-server）
# SSE 流式响应需要关闭 proxy_buffering，并放宽超时

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.pg.agcli.cn;

    # 证书与 assets.pg.agcli.cn 共用（SAN 包含两个域名）
    ssl_certificate /etc/letsencrypt/live/assets.pg.agcli.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.pg.agcli.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 健康检查
    location = /health {
        proxy_pass http://127.0.0.1:6080/health;
        proxy_set_header Host $host;
    }

    # Agent 中转 API（SSE 流式）
    location /agent/ {
        proxy_pass http://127.0.0.1:6080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关闭缓冲，让 chunk 实时透传
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # DeepSeek 流式可能较慢，放宽超时（5 分钟）
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.pg.agcli.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
