# assets.pg.agcli.cn — 静态资源 CDN（WASM、showcase SVG、playground assets 等）
#
# plotgram.cn 备案通过后，assets.plotgram.cn 作为本 server 的 server_name 别名，
# 指向同一份静态资源（同 root、同 location、同证书）。
#
# 证书需通过 certbot 扩展以同时覆盖 assets.pg.agcli.cn / api.pg.agcli.cn /
# assets.plotgram.cn / api.plotgram.cn 四个域名：
#   certbot certonly --cert-name assets.pg.agcli.cn --expand \
#       -d assets.pg.agcli.cn -d api.pg.agcli.cn \
#       -d assets.plotgram.cn -d api.plotgram.cn

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name assets.pg.agcli.cn assets.plotgram.cn;

    ssl_certificate /etc/letsencrypt/live/assets.pg.agcli.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.pg.agcli.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/assets.pg.agcli.cn;
    index index.html;

    # 跨域加载 WASM / SVG / ES module
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        try_files $uri =404;
    }

    # tautcore wasm common 路径：三端（website / playground / agent）共用同一份产物。
    # 文件名无 hash，靠 ETag（nginx 自动生成）+ no-cache 控制缓存：
    # 浏览器每次发 If-None-Match，文件未变返回 304（无 body），更新后 ETag 变化即拉新。
    location ^~ /tautcore-wasm/ {
        etag on;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # 旧路径兼容（playground / agent 子路径下的 wasm），指向同一份产物
    location ^~ /playground/tautcore-wasm/ {
        etag on;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /agent/tautcore-wasm/ {
        etag on;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

  # Vite 打包产物带 content hash，可长期缓存
    location ^~ /editor/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /playground/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /agent/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # website（landing page）打包产物带 content hash，可长期缓存
    location ^~ /website/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.(js|css|png|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/wasm
        image/svg+xml;
}

server {
    listen 80;
    listen [::]:80;
    server_name assets.pg.agcli.cn assets.plotgram.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
