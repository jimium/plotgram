<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tautcore Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --ink: #14181f;
      --ink-soft: #3d4654;
      --muted: #6b7380;
      --line: rgba(20, 24, 31, 0.10);
      --line-strong: rgba(20, 24, 31, 0.18);
      --paper: #eef1f4;
      --panel: #f7f8fa;
      --panel-raise: #ffffff;
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --accent-ink: #0a5c56;
      --ok: #1a7f4b;
      --warn: #b45309;
      --bad: #b42318;
      --changed: #0e7490;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --sans: "Sora", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --rail: 248px;
      --radius: 10px;
      --shadow: 0 1px 0 rgba(20,24,31,0.04), 0 12px 28px rgba(20,24,31,0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(20,24,31,0.035) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(rgba(20,24,31,0.035) 1px, transparent 1px) 0 0 / 28px 28px,
        radial-gradient(1200px 600px at 10% -10%, rgba(15,118,110,0.08), transparent 55%),
        var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: grid;
      grid-template-columns: var(--rail) 1fr;
      min-height: 100%;
    }

    /* ── rail ── */
    .rail {
      position: sticky; top: 0; align-self: start; height: 100vh;
      padding: 22px 16px 28px;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(10px);
      overflow: auto;
      display: flex; flex-direction: column; gap: 18px;
    }
    .brand {
      display: flex; flex-direction: column; gap: 4px;
      padding: 0 4px 4px;
    }
    .brand-mark {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent);
    }
    .brand-title {
      font-size: 22px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
    }
    .brand-sub {
      font-size: 12px; color: var(--muted); line-height: 1.45;
    }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .stat {
      background: var(--panel-raise);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
    }
    .stat b {
      display: block; font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .stat span { font-size: 11px; color: var(--muted); }
    .stat.warn b { color: var(--warn); }
    .stat.bad b { color: var(--bad); }
    .stat.changed b { color: var(--changed); }

    .filter-block { display: flex; flex-direction: column; gap: 8px; }
    .filter-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); padding: 0 2px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font: inherit; font-size: 12px; font-weight: 500;
      padding: 5px 9px; border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--panel-raise);
      color: var(--ink-soft);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
    }
    .chip:hover { border-color: var(--line-strong); color: var(--ink); }
    .chip.active {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      color: var(--accent-ink);
    }
    .chip .n {
      margin-left: 4px; opacity: 0.55; font-variant-numeric: tabular-nums;
      font-family: var(--mono); font-size: 10.5px;
    }
    .chip:disabled { opacity: 0.4; cursor: default; }

    .search-wrap { position: relative; }
    .search-wrap input {
      width: 100%; font: inherit; font-size: 13px;
      padding: 9px 10px 9px 32px;
      border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel-raise); color: var(--ink);
    }
    .search-wrap input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search-wrap::before {
      content: "/";
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }

    .rail-actions {
      margin-top: auto; display: flex; flex-direction: column; gap: 8px;
    }
    .linkish {
      font: inherit; font-size: 12px; color: var(--accent-ink);
      background: none; border: none; padding: 0; cursor: pointer; text-align: left;
    }
    .linkish:hover { text-decoration: underline; }
    .meta-foot {
      font-size: 11px; color: var(--muted); line-height: 1.45;
      font-family: var(--mono);
    }

    /* ── main ── */
    .main { padding: 22px 26px 64px; min-width: 0; }
    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .result-count {
      font-size: 13px; color: var(--muted);
    }
    .result-count b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }
    .seg {
      display: inline-flex; border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; background: var(--panel-raise);
    }
    .seg button {
      font: inherit; font-size: 12px; font-weight: 500;
      padding: 6px 11px; border: none; background: transparent;
      color: var(--muted); cursor: pointer;
    }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.active { background: var(--accent-soft); color: var(--accent-ink); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .grid.compact {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .card {
      background: var(--panel-raise);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
      display: flex; flex-direction: column;
      animation: rise 0.28s ease both;
    }
    .card:hover {
      border-color: var(--line-strong);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .card.changed {
      border-color: color-mix(in srgb, var(--changed) 45%, var(--line));
    }
    .card.compact-row {
      flex-direction: row; align-items: center; gap: 12px;
      padding: 8px 12px; min-height: 52px;
    }
    .card.compact-row .thumb { display: none; }
    .card.compact-row .card-body { padding: 0; flex: 1; min-width: 0; }

    .thumb {
      aspect-ratio: 16 / 11;
      background:
        linear-gradient(135deg, #f3f5f7 0%, #e8ecf0 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; border-bottom: 1px solid var(--line);
    }
    .thumb img {
      width: 100%; height: 100%; object-fit: contain; background: #fff;
    }
    .thumb .ph {
      padding: 16px; text-align: center; font-size: 12px; color: var(--muted);
      line-height: 1.5; max-width: 90%;
    }
    .thumb .ph.err { color: var(--bad); }

    .card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
    .card-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .card-name {
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      line-height: 1.35; word-break: break-all; color: var(--ink);
    }
    .card-path {
      font-family: var(--mono); font-size: 10.5px; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; flex-shrink: 0; }
    .badge {
      font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
      padding: 2px 6px; border-radius: 5px; line-height: 1.5;
      text-transform: uppercase;
    }
    .badge.ok { background: rgba(26,127,75,0.12); color: var(--ok); }
    .badge.parse-error { background: rgba(180,83,9,0.12); color: var(--warn); }
    .badge.render-error { background: rgba(180,35,24,0.12); color: var(--bad); }
    .badge.changed { background: rgba(14,116,144,0.12); color: var(--changed); }
    .badge.facet { background: rgba(20,24,31,0.06); color: var(--ink-soft); text-transform: none; }
    .badge.role { background: var(--accent-soft); color: var(--accent-ink); text-transform: none; }

    .empty {
      grid-column: 1 / -1;
      text-align: center; padding: 56px 16px;
      color: var(--muted); font-size: 14px;
      background: var(--panel-raise); border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    .loading { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    /* ── lightbox ── */
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(12, 16, 22, 0.88);
      display: none; flex-direction: column;
    }
    .lightbox.open { display: flex; }
    .lb-header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; color: #e8edf2; flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .lb-title {
      font-family: var(--mono); font-size: 12.5px; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lb-toolbar { display: flex; gap: 6px; align-items: center; }
    .lb-toolbar button, .lb-close {
      font: inherit; font-size: 13px; color: #e8edf2;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
      padding: 4px 10px; cursor: pointer;
    }
    .lb-toolbar button:hover, .lb-close:hover { background: rgba(255,255,255,0.14); }
    .lb-toolbar .zoom-pct {
      font-family: var(--mono); font-size: 11px; color: #9aa4b2;
      min-width: 44px; text-align: center;
    }
    .lb-close { font-size: 18px; line-height: 1; padding: 2px 10px; }
    .lb-body { flex: 1; display: flex; min-height: 0; }
    .lb-svg-pane {
      flex: 1; overflow: hidden; background: #fff; position: relative;
      touch-action: none; cursor: grab;
    }
    .lb-svg-pane.panning { cursor: grabbing; }
    .lb-svg-pane img {
      position: absolute; top: 0; left: 0; transform-origin: 0 0;
      max-width: none; display: block;
    }
    .lb-dsl-pane {
      width: min(42vw, 520px); flex-shrink: 0;
      background: #0f141a; border-left: 1px solid rgba(255,255,255,0.08);
      overflow: auto; margin: 0; display: flex; flex-direction: column;
    }
    .lb-dsl-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
      color: #9aa4b2; font-size: 11px; font-family: var(--mono);
    }
    .lb-tabs { display: flex; gap: 4px; }
    .lb-tab {
      font: inherit; font-size: 11px; color: #9aa4b2;
      background: transparent; border: 1px solid transparent; border-radius: 6px;
      padding: 3px 9px; cursor: pointer;
    }
    .lb-tab:hover { color: #e8edf2; }
    .lb-tab.active {
      color: #e8edf2; background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.14);
    }
    .lb-dsl-pane pre {
      margin: 0; padding: 14px 16px;
      font: 12.5px/1.55 var(--mono);
      color: #d7dee7; white-space: pre; tab-size: 2;
    }
    .lb-dsl-pane pre.hide { display: none; }
    .lb-hint {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(12,16,22,0.72); color: #e8edf2; font-size: 11px;
      padding: 5px 11px; border-radius: 999px; pointer-events: none;
      opacity: 0.85; transition: opacity 0.4s;
    }
    .lb-hint.hide { opacity: 0; }

    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; }
      .rail {
        position: relative; height: auto; max-height: none;
        border-right: none; border-bottom: 1px solid var(--line);
      }
      .rail-actions { margin-top: 8px; }
      .lb-body { flex-direction: column; }
      .lb-dsl-pane { width: 100%; height: 38%; border-left: none; border-top: 1px solid rgba(255,255,255,0.08); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark">Tautcore</div>
        <div class="brand-title">Showcase</div>
        <div class="brand-sub">布局视觉监视 · layout → facet → role</div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="search-wrap">
        <input type="search" id="search" placeholder="搜索路径或 slug…" autocomplete="off" />
      </div>

      <div class="filter-block">
        <div class="filter-label">Layout</div>
        <div class="chips" id="layout-chips"></div>
      </div>
      <div class="filter-block" id="facet-block" hidden>
        <div class="filter-label">Facet</div>
        <div class="chips" id="facet-chips"></div>
      </div>
      <div class="filter-block">
        <div class="filter-label">Role</div>
        <div class="chips" id="role-chips"></div>
      </div>
      <div class="filter-block">
        <div class="filter-label">Status</div>
        <div class="chips" id="status-chips"></div>
      </div>

      <div class="rail-actions">
        <button class="linkish" id="clearFilters" type="button">清除全部筛选</button>
        <button class="linkish" id="failOnly" type="button">只看失败</button>
        <div class="meta-foot" id="meta-foot"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="result-count" id="result-count"></div>
        <div class="spacer"></div>
        <div class="seg" id="view-seg">
          <button type="button" data-view="grid" class="active">网格</button>
          <button type="button" data-view="list">列表</button>
        </div>
      </div>
      <div class="grid" id="grid">
        <div class="loading">加载 manifest…</div>
      </div>
    </main>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lb-header">
      <span class="lb-title" id="lb-title"></span>
      <div class="lb-toolbar">
        <button id="lb-prev" type="button" title="上一个 (k)">↑</button>
        <button id="lb-next" type="button" title="下一个 (j)">↓</button>
        <button id="lb-zoom-out" type="button" title="缩小 (-)">−</button>
        <span class="zoom-pct" id="lb-zoom-pct">100%</span>
        <button id="lb-zoom-in" type="button" title="放大 (+)">+</button>
        <button id="lb-fit" type="button" title="适应 (0)">适应</button>
        <button id="lb-actual" type="button" title="1:1">1:1</button>
      </div>
      <button class="lb-close" id="lb-close" type="button" title="关闭 (Esc)">×</button>
    </div>
    <div class="lb-body">
      <div class="lb-svg-pane" id="lb-svg-pane">
        <img id="lb-img" alt="" />
        <div class="lb-hint" id="lb-hint">j/k 切换 · f 布局事实 · 拖拽平移 · 滚轮缩放 · Esc 关闭</div>
      </div>
      <div class="lb-dsl-pane">
        <div class="lb-dsl-bar">
          <div class="lb-tabs">
            <button id="lb-tab-dsl" class="lb-tab active" type="button">DSL</button>
            <button id="lb-tab-facts" class="lb-tab" type="button">布局事实</button>
          </div>
          <button class="linkish" id="lb-copy" type="button" style="color:#9ec8c3">复制路径</button>
        </div>
        <pre id="lb-dsl"></pre>
        <pre id="lb-facts" class="hide"></pre>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const STATUS_META = {
      "ok":           { label: "ok", cls: "ok" },
      "parse-error":  { label: "parse", cls: "parse-error" },
      "render-error": { label: "render", cls: "render-error" },
    };
    const ROLE_ORDER = ["smoke", "product", "demo", "stress", "mech"];
    const STATUS_ORDER = ["ok", "parse-error", "render-error", "changed"];
    const FACET_ORDER = ["flat", "group", "partition", "plain", "compound", "fragment", "single", "components"];

    const state = {
      manifest: null,
      layout: null,
      facet: new Set(),
      role: new Set(),
      status: new Set(),
      search: "",
      view: "grid",
      filtered: [],
      lbIndex: -1,
      lbTab: "dsl",
      lbFactsUrl: null,
      scale: 1, tx: 0, ty: 0, isFit: true,
      hintTimer: null,
    };

    const $ = (id) => document.getElementById(id);
    const grid = $("grid");

    function parseHash() {
      const h = location.hash.replace(/^#/, "");
      state.layout = null;
      state.facet.clear();
      state.role.clear();
      state.status.clear();
      state.search = "";
      state.view = "grid";
      if (h) {
        const params = new URLSearchParams(h);
        const layoutV = params.get("layout");
        if (layoutV) state.layout = layoutV.split(",")[0] || null;
        for (const [k, set] of [
          ["facet", state.facet],
          ["role", state.role],
          ["status", state.status],
        ]) {
          const v = params.get(k);
          if (v) v.split(",").filter(Boolean).forEach((x) => set.add(x));
        }
        state.search = params.get("q") || "";
        state.view = params.get("view") === "list" ? "list" : "grid";
      }
      $("search").value = state.search;
    }

    function applyHashToUi() {
      if (!state.manifest) return;
      parseHash();
      syncViewSeg();
      buildFilters();
      renderAll();
    }

    function writeHash() {
      const params = new URLSearchParams();
      const put = (k, set) => { if (set.size) params.set(k, [...set].sort().join(",")); };
      if (state.layout) params.set("layout", state.layout);
      put("facet", state.facet);
      put("role", state.role);
      put("status", state.status);
      if (state.search) params.set("q", state.search);
      if (state.view !== "grid") params.set("view", state.view);
      const s = params.toString();
      const next = s ? `#${s}` : "#";
      if (location.hash !== next && !(location.hash === "" && next === "#")) {
        history.replaceState(null, "", next === "#" ? location.pathname + location.search : next);
      }
    }

    window.addEventListener("hashchange", () => {
      if (!state.manifest) return;
      applyHashToUi();
    });

    async function loadManifest() {
      try {
        const r = await fetch("_out/manifest.json", { cache: "no-cache" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        state.manifest = await r.json();
        for (const s of state.manifest.samples) {
          if (s.facet === undefined) s.facet = facetFromPath(s.path);
        }
      } catch (e) {
        grid.innerHTML = `<div class="empty">无法加载 <code>_out/manifest.json</code>。<br>请先运行 <code>./apps/showcase/render.sh</code>（渲染）再启动 <code>./apps/serve.sh</code>，然后打开 <code>http://localhost:8030/showcase/index.html</code>。<br><br><small>${e}</small></div>`;
        return;
      }
      applyHashToUi();
    }

    function facetFromPath(path) {
      const parts = path.split("/");
      return parts.length >= 3 ? parts[1] : null;
    }

    function sortKeys(keys, order) {
      return [...keys].sort((a, b) => {
        const ia = order.indexOf(a), ib = order.indexOf(b);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || String(a).localeCompare(b);
      });
    }

    function layoutScopedSamples() {
      return state.manifest.samples.filter((s) =>
        !state.layout || s.layout === state.layout
      );
    }

    function buildFilters() {
      const samples = state.manifest.samples;
      const layouts = new Map();
      const roles = new Map();
      const statuses = new Map();
      for (const s of samples) {
        layouts.set(s.layout, (layouts.get(s.layout) || 0) + 1);
        roles.set(s.role, (roles.get(s.role) || 0) + 1);
        statuses.set(s.status, (statuses.get(s.status) || 0) + 1);
        if (s.changed) statuses.set("changed", (statuses.get("changed") || 0) + 1);
      }
      renderSingleChips("layout-chips", state.layout, sortKeys(layouts.keys(), [...layouts.keys()].sort()), layouts);
      renderChips("role-chips", state.role, sortKeys(roles.keys(), ROLE_ORDER), roles);
      renderChips("status-chips", state.status, STATUS_ORDER.filter((k) => statuses.has(k)), statuses, (k) =>
        k === "changed" ? "changed" : (STATUS_META[k]?.label || k)
      );
      rebuildFacetChips();
    }

    function rebuildFacetChips() {
      const scoped = layoutScopedSamples();
      const facets = new Map();
      for (const s of scoped) {
        if (s.facet) facets.set(s.facet, (facets.get(s.facet) || 0) + 1);
      }
      const block = $("facet-block");
      if (!facets.size) {
        block.hidden = true;
        state.facet.clear();
        return;
      }
      block.hidden = false;
      // drop facet selections that are no longer visible
      for (const f of [...state.facet]) {
        if (!facets.has(f)) state.facet.delete(f);
      }
      renderChips("facet-chips", state.facet, sortKeys(facets.keys(), FACET_ORDER), facets);
    }

    function renderSingleChips(containerId, active, keys, counts, labelFn) {
      const el = $(containerId);
      el.innerHTML = "";
      for (const k of keys) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (active === k ? " active" : "");
        const label = labelFn ? labelFn(k) : k;
        chip.innerHTML = `${label}<span class="n">${counts.get(k) || 0}</span>`;
        chip.onclick = () => {
          state.layout = active === k ? null : k;
          rebuildFacetChips();
          renderSingleChips(containerId, state.layout, keys, counts, labelFn);
          renderAll();
        };
        el.appendChild(chip);
      }
    }

    function renderChips(containerId, activeSet, keys, counts, labelFn) {
      const el = $(containerId);
      el.innerHTML = "";
      for (const k of keys) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (activeSet.has(k) ? " active" : "");
        const label = labelFn ? labelFn(k) : k;
        chip.innerHTML = `${label}<span class="n">${counts.get(k) || 0}</span>`;
        chip.onclick = () => {
          if (activeSet.has(k)) activeSet.delete(k);
          else activeSet.add(k);
          renderChips(containerId, activeSet, keys, counts, labelFn);
          renderAll();
        };
        el.appendChild(chip);
      }
    }

    function matchesFilters(s) {
      if (state.layout && s.layout !== state.layout) return false;
      if (state.facet.size && !state.facet.has(s.facet || "")) return false;
      if (state.role.size && !state.role.has(s.role)) return false;
      if (state.status.size) {
        let ok = false;
        for (const st of state.status) {
          if (st === "changed") { if (s.changed) ok = true; }
          else if (s.status === st) ok = true;
        }
        if (!ok) return false;
      }
      if (state.search) {
        const q = state.search.toLowerCase();
        if (!s.path.toLowerCase().includes(q)) return false;
      }
      return true;
    }

    function renderStats() {
      const subs = layoutScopedSamples();
      const total = subs.length;
      const pe = subs.filter((s) => s.status === "parse-error").length;
      const re = subs.filter((s) => s.status === "render-error").length;
      const changed = subs.filter((s) => s.changed).length;
      const fail = pe + re;
      $("stats").innerHTML = `
        <div class="stat"><b>${total}</b><span>样例</span></div>
        <div class="stat${fail ? " bad" : ""}"><b>${fail}</b><span>失败</span></div>
        <div class="stat${pe ? " warn" : ""}"><b>${pe}</b><span>parse</span></div>
        <div class="stat${changed ? " changed" : ""}"><b>${changed}</b><span>变化</span></div>
      `;
      const ts = state.manifest.generated_at || "";
      const hash = (state.manifest.binary_hash || "").slice(0, 8);
      $("meta-foot").textContent = `${hash || "—"}\n${ts}`;
    }

    function renderGrid() {
      const samples = state.manifest.samples.filter(matchesFilters);
      state.filtered = samples;
      $("result-count").innerHTML = `显示 <b>${samples.length}</b> / ${state.manifest.samples.length}`;
      grid.className = "grid" + (state.view === "list" ? " compact" : "");
      grid.innerHTML = "";
      if (!samples.length) {
        grid.innerHTML = `<div class="empty">无匹配样例。<br><button class="linkish" id="emptyClear" type="button">清除筛选</button></div>`;
        const ec = $("emptyClear");
        if (ec) ec.onclick = clearAll;
        return;
      }
      const compact = state.view === "list";
      samples.forEach((s, i) => {
        const card = document.createElement("article");
        card.className = "card" + (s.changed ? " changed" : "") + (compact ? " compact-row" : "");
        card.style.animationDelay = Math.min(i, 24) * 12 + "ms";

        if (!compact) {
          const thumb = document.createElement("div");
          thumb.className = "thumb";
          if (s.status === "ok" && s.svg) {
            const img = document.createElement("img");
            img.src = s.svg;
            img.alt = s.path;
            img.loading = "lazy";
            img.decoding = "async";
            thumb.appendChild(img);
          } else {
            const ph = document.createElement("div");
            ph.className = "ph err";
            ph.textContent = s.error ? s.error.slice(0, 180) : "无 SVG";
            thumb.appendChild(ph);
          }
          card.appendChild(thumb);
        }

        const body = document.createElement("div");
        body.className = "card-body";
        const top = document.createElement("div");
        top.className = "card-top";
        const name = document.createElement("div");
        name.className = "card-name";
        name.textContent = s.path.split("/").pop();
        top.appendChild(name);

        const badges = document.createElement("div");
        badges.className = "badges";
        const sm = STATUS_META[s.status] || STATUS_META["render-error"];
        badges.innerHTML = `<span class="badge ${sm.cls}">${sm.label}</span>`;
        if (s.facet) badges.innerHTML += `<span class="badge facet">${s.facet}</span>`;
        badges.innerHTML += `<span class="badge role">${s.role}</span>`;
        if (s.changed) badges.innerHTML += `<span class="badge changed">Δ</span>`;
        top.appendChild(badges);
        body.appendChild(top);

        const pathEl = document.createElement("div");
        pathEl.className = "card-path";
        pathEl.textContent = s.path;
        pathEl.title = s.path;
        body.appendChild(pathEl);
        card.appendChild(body);

        card.onclick = () => openLightbox(s.path);
        grid.appendChild(card);
      });
    }

    function renderAll() {
      writeHash();
      renderStats();
      renderGrid();
    }

    function clearAll() {
      state.layout = null; state.facet.clear(); state.role.clear(); state.status.clear();
      state.search = "";
      $("search").value = "";
      buildFilters();
      renderAll();
    }

    function syncViewSeg() {
      for (const btn of $("view-seg").querySelectorAll("button")) {
        btn.classList.toggle("active", btn.dataset.view === state.view);
      }
    }

    $("view-seg").onclick = (e) => {
      const btn = e.target.closest("button[data-view]");
      if (!btn) return;
      state.view = btn.dataset.view;
      syncViewSeg();
      renderAll();
    };

    $("clearFilters").onclick = clearAll;
    $("failOnly").onclick = () => {
      state.status = new Set(["parse-error", "render-error"]);
      buildFilters();
      renderAll();
    };

    let searchTimer = null;
    $("search").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.search = e.target.value.trim();
        renderAll();
      }, 100);
    });

    // ── lightbox ──
    const lb = $("lightbox");
    const lbImg = $("lb-img");
    const lbDsl = $("lb-dsl");
    const lbFacts = $("lb-facts");
    const lbTabDslBtn = $("lb-tab-dsl");
    const lbTabFactsBtn = $("lb-tab-facts");
    const lbTitle = $("lb-title");
    const lbZoomPct = $("lb-zoom-pct");
    const lbSvgPane = $("lb-svg-pane");
    const lbHint = $("lb-hint");

    function factsUrlFor(path) {
      const stem = path.endsWith(".taut") ? path.slice(0, -4) : path;
      return `_out/${stem}.facts.txt`;
    }

    async function loadFacts(force) {
      const s = state.filtered[state.lbIndex];
      if (!s) return;
      const url = factsUrlFor(s.path);
      if (!force && state.lbFactsUrl === url) return;
      state.lbFactsUrl = url;
      lbFacts.textContent = "加载布局事实…";
      try {
        const r = await fetch(url, { cache: "no-cache" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const text = await r.text();
        if (state.lbFactsUrl === url) lbFacts.textContent = text;
      } catch (e) {
        if (state.lbFactsUrl === url) {
          lbFacts.textContent = `// 无法加载 ${url}: ${e}\n// 请先运行 ./apps/showcase/render.sh 生成 facts sidecar`;
        }
      }
    }

    function setLbTab(tab) {
      state.lbTab = tab;
      lbTabDslBtn.classList.toggle("active", tab === "dsl");
      lbTabFactsBtn.classList.toggle("active", tab === "facts");
      lbDsl.classList.toggle("hide", tab !== "dsl");
      lbFacts.classList.toggle("hide", tab !== "facts");
      if (tab === "facts") loadFacts(false);
    }
    lbTabDslBtn.onclick = () => setLbTab("dsl");
    lbTabFactsBtn.onclick = () => setLbTab("facts");

    async function openLightbox(path) {
      const idx = state.filtered.findIndex((s) => s.path === path);
      if (idx < 0) return;
      state.lbIndex = idx;
      await renderLightbox();
      lb.classList.add("open");
      lb.setAttribute("aria-hidden", "false");
      lbHint.classList.remove("hide");
      clearTimeout(state.hintTimer);
      state.hintTimer = setTimeout(() => lbHint.classList.add("hide"), 2200);
      if (state.isFit) requestAnimationFrame(fitToView);
    }

    async function renderLightbox() {
      const s = state.filtered[state.lbIndex];
      if (!s) return;
      lbTitle.textContent = s.path;
      lbDsl.textContent = "加载 DSL…";
      lbFacts.textContent = "";
      state.lbFactsUrl = null;
      lbImg.removeAttribute("src");
      lbImg.style.visibility = "hidden";
      state.scale = 1; state.tx = 0; state.ty = 0; state.isFit = true;
      lbZoomPct.textContent = "适应";
      if (s.status === "ok" && s.svg) {
        lbImg.src = s.svg;
        lbImg.alt = s.path;
      }
      try {
        const r = await fetch(s.path, { cache: "no-cache" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        lbDsl.textContent = await r.text();
      } catch (e) {
        lbDsl.textContent = `// 无法加载 ${s.path}: ${e}`;
      }
      if (state.lbTab === "facts") loadFacts(true);
      if (state.isFit) requestAnimationFrame(fitToView);
    }

    function closeLightbox() {
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden", "true");
      state.lbIndex = -1;
      lbImg.removeAttribute("src");
    }

    function moveLightbox(delta) {
      if (state.lbIndex < 0) return;
      const n = state.lbIndex + delta;
      if (n < 0 || n >= state.filtered.length) return;
      state.lbIndex = n;
      renderLightbox();
    }

    const MIN_SCALE = 0.1, MAX_SCALE = 8, PAN_MARGIN = 0.3;
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function imgNaturalSize() {
      return { w: lbImg.naturalWidth || 800, h: lbImg.naturalHeight || 600 };
    }
    function clampPan(newTx, newTy, s) {
      const { w: nw, h: nh } = imgNaturalSize();
      if (!nw || !nh) return { tx: newTx, ty: newTy };
      const cw = lbSvgPane.clientWidth, ch = lbSvgPane.clientHeight;
      const sw = nw * s, sh = nh * s;
      const ovX = PAN_MARGIN * Math.min(sw, cw);
      const ovY = PAN_MARGIN * Math.min(sh, ch);
      return {
        tx: clamp(newTx, ovX - sw, cw - ovX),
        ty: clamp(newTy, ovY - sh, ch - ovY),
      };
    }
    function applyTransform() {
      const { w: nw } = imgNaturalSize();
      lbImg.style.width = nw + "px";
      lbImg.style.height = "auto";
      lbImg.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
      lbImg.style.visibility = "visible";
      lbZoomPct.textContent = state.isFit ? "适应" : Math.round(state.scale * 100) + "%";
    }
    function fitToView() {
      const { w: nw, h: nh } = imgNaturalSize();
      const cw = lbSvgPane.clientWidth, ch = lbSvgPane.clientHeight;
      if (!nw || !nh || !cw || !ch) return;
      const fitScale = Math.min((cw - 48) / nw, (ch - 48) / nh);
      const next = clamp(Math.min(fitScale, 1), MIN_SCALE, MAX_SCALE);
      state.scale = next;
      state.tx = (cw - nw * next) / 2;
      state.ty = (ch - nh * next) / 2;
      state.isFit = true;
      applyTransform();
    }
    function resetView() {
      const { w: nw } = imgNaturalSize();
      state.scale = 1;
      state.tx = (lbSvgPane.clientWidth - nw) / 2;
      state.ty = 24;
      state.isFit = false;
      applyTransform();
    }
    function zoomBy(factor, originX, originY) {
      const rect = lbSvgPane.getBoundingClientRect();
      const px = originX ?? rect.width / 2;
      const py = originY ?? rect.height / 2;
      const prev = state.scale;
      const next = clamp(prev * factor, MIN_SCALE, MAX_SCALE);
      const ratio = next / prev;
      const clamped = clampPan(px - (px - state.tx) * ratio, py - (py - state.ty) * ratio, next);
      state.scale = next; state.tx = clamped.tx; state.ty = clamped.ty; state.isFit = false;
      applyTransform();
    }
    function panBy(dx, dy) {
      const clamped = clampPan(state.tx + dx, state.ty + dy, state.scale);
      state.tx = clamped.tx; state.ty = clamped.ty; state.isFit = false;
      applyTransform();
    }

    $("lb-zoom-in").onclick = () => zoomBy(1.2);
    $("lb-zoom-out").onclick = () => zoomBy(1 / 1.2);
    $("lb-fit").onclick = () => fitToView();
    $("lb-actual").onclick = () => resetView();
    $("lb-close").onclick = closeLightbox;
    $("lb-prev").onclick = () => moveLightbox(-1);
    $("lb-next").onclick = () => moveLightbox(1);
    $("lb-copy").onclick = async () => {
      const s = state.filtered[state.lbIndex];
      if (!s) return;
      try { await navigator.clipboard.writeText(s.path); } catch (_) {}
    };

    let panMoved = false;
    lb.addEventListener("click", (e) => {
      if (panMoved) { panMoved = false; return; }
      if (e.target === lb || e.target === lbSvgPane) closeLightbox();
    });

    lbSvgPane.addEventListener("wheel", (e) => {
      if (!lb.classList.contains("open")) return;
      e.preventDefault();
      if (e.ctrlKey) {
        const rect = lbSvgPane.getBoundingClientRect();
        zoomBy(Math.exp(-e.deltaY * 0.01), e.clientX - rect.left, e.clientY - rect.top);
      } else {
        panBy(-e.deltaX, -e.deltaY);
      }
    }, { passive: false });

    let panState = null;
    lbSvgPane.addEventListener("pointerdown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      lbSvgPane.setPointerCapture(e.pointerId);
      panState = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
      panMoved = false;
      lbSvgPane.classList.add("panning");
    });
    lbSvgPane.addEventListener("pointermove", (e) => {
      if (!panState) return;
      const dx = e.clientX - panState.x, dy = e.clientY - panState.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) panMoved = true;
      const clamped = clampPan(panState.tx + dx, panState.ty + dy, state.scale);
      state.tx = clamped.tx; state.ty = clamped.ty; state.isFit = false;
      applyTransform();
    });
    const endPan = (e) => {
      if (!panState) return;
      panState = null;
      lbSvgPane.classList.remove("panning");
      if (e && lbSvgPane.hasPointerCapture?.(e.pointerId)) lbSvgPane.releasePointerCapture(e.pointerId);
    };
    lbSvgPane.addEventListener("pointerup", endPan);
    lbSvgPane.addEventListener("pointercancel", endPan);
    lbImg.addEventListener("load", () => { if (state.isFit) requestAnimationFrame(fitToView); });
    window.addEventListener("resize", () => {
      if (lb.classList.contains("open") && state.isFit) fitToView();
    });
    new ResizeObserver(() => {
      if (lb.classList.contains("open") && state.isFit) fitToView();
    }).observe(lbSvgPane);

    document.addEventListener("keydown", (e) => {
      if (lb.classList.contains("open")) {
        if (e.key === "Escape") { e.preventDefault(); closeLightbox(); }
        else if (e.key === "j") { e.preventDefault(); moveLightbox(1); }
        else if (e.key === "k") { e.preventDefault(); moveLightbox(-1); }
        else if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomBy(1.2); }
        else if (e.key === "-") { e.preventDefault(); zoomBy(1 / 1.2); }
        else if (e.key === "0") { e.preventDefault(); fitToView(); }
        else if (e.key === "f") { e.preventDefault(); setLbTab(state.lbTab === "facts" ? "dsl" : "facts"); }
        return;
      }
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault(); $("search").focus();
      }
    });

    loadManifest();
  </script>
</body>
</html>
